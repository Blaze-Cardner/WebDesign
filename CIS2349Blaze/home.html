<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blaze Cardner</title>
    <link rel="icon" type="image/x-icon" href="./imgs/favicon.ico">
    <style>
        body {
            font-family: 'Times New Roman', serif; /* Font style */
            background-color: #f4f4f4; /* Light background */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }


        h1 {
            background-color: #ADD8E6; /* Light blue header */
            text-align: left;
            padding: 20px;
            margin: 0;
            width: 100%; /* Ensure the header spans the entire width */
            position: fixed;
            top: 0;
            left: 0; /* Align header to the left */
            z-index: 10; /* Ensures header stays on top */
        }

        /* Sidebar menu */
        .sidebar {
            background-color: #333; /* Dark sidebar */
            width: 200px;
            height: 100vh; /* Full height of the page */
            padding-top: 60px; /* Adjusted padding to bring the links up */
            position: fixed;
            top: 80px; /* Start sidebar just below header */
            left: 0;
        }

        /* Links in the sidebar */
        .sidebar a {
            display: block;
            text-decoration: none;
            color: #fff; /* White text */
            text-align: left;
            padding: 15px;
            font-size: 20px; /* Larger link text */
        }

        .sidebar a:hover {
            background-color: #575757; /* Darker background on hover */
        }

        /* Content area */
        .content {
            margin-left: 220px; /* Space for the sidebar */
            padding: 100px 20px 20px 20px; /* Add space on top for the fixed header */
            width: calc(100% - 220px); /* Ensure content doesn't overlap sidebar */
        }

        p {
            font-size: 20px;
            text-align: left;
        }
    </style>
</head>

<body>
    <h1>Blaze Cardner's Website CIS 2329</h1>

    <div class="sidebar">
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="awards.html">Awards</a>
        <a href="hobbiesandinterests.html">Hobbies and Interests</a>
        <a href="sandbox.html">Sandbox</a>
    </div>

    <div class="content">
        <p>Welcome. Please navigate using the sidebar!<br><br>
</p>
    </div>
</body>

</html>
